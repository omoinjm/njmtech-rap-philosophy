services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chamber
      POSTGRES_PASSWORD: chamber
      POSTGRES_DB: chamber
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chamber -d chamber"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://chamber:chamber@db:5432/chamber
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-168}
      D1_LOCAL_PATH: /app/.data/auth.db
      D1_DATABASE_ID: ${D1_DATABASE_ID:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./migrations:/migrations
      - d1_data:/app/.data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      INTERNAL_API_URL: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: npm run dev -- --turbopack -H 0.0.0.0 -p 3000

volumes:
  postgres_data:
  d1_data:
  frontend_node_modules:
  frontend_next:
