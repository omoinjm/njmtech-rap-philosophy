# Local dev only — production uses Cloudflare Workers (see README).
# Run: docker compose up frontend
# API: npm run dev:api in a separate terminal

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      INTERNAL_API_URL: http://host.docker.internal:8787
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: npm run dev -- --turbopack -H 0.0.0.0 -p 3000

volumes:
  frontend_node_modules:
  frontend_next:
